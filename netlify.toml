# This site's contact API (`api/contact`) is built for Vercel serverless.
# Prefer deploying on Vercel. On Netlify, the SPA fallback below will serve
# the frontend, but `/api/contact` will not work without a Netlify Function.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
